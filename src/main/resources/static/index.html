<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IoT Monitor</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container">
      <h1>IoT MONITOR</h1>

      <div class="grid">
        <!-- TEMPERATURA -->
        <div class="card">
          <div class="label">TEMPERATURE</div>

          <div class="value"><span id="temp">--</span> °C</div>
        </div>

        <!-- WILGOTNOŚĆ -->
        <div class="card">
          <div class="label">HUMITIDY</div>

          <div class="value"><span id="hum">--</span> %</div>
        </div>
      </div>

      <!-- STATUS -->
      <div class="card">
        <div class="label">DEVICE STATUS</div>

        <div class="value" id="status" style="font-size: 24px"></div>
      </div>

      <!-- BUTTON -->
      <div style="text-align: center; margin-top: 20px">
        <button onclick="load()">REFRESH DATA</button>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
